name: Terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  push:
    branches:
      - main
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml

concurrency:
  group: terraform-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.5
  # Personal data stays out of the repository and out of the (public) logs.
  TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      roots: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - infra/terraform/global/**
              - infra/terraform/modules/github-oidc-role/**
              - .github/workflows/terraform.yml
            envs/prod/site:
              - infra/terraform/envs/prod/site/**
              - infra/terraform/modules/static-site/**
              - infra/terraform/modules/github-oidc-role/**
              - .github/workflows/terraform.yml
            envs/prod/network:
              - infra/terraform/envs/prod/network/**
              - .github/workflows/terraform.yml
            envs/prod/data:
              - infra/terraform/envs/prod/data/**
              - .github/workflows/terraform.yml
            envs/prod/ecr:
              - infra/terraform/envs/prod/ecr/**
              - infra/terraform/modules/github-oidc-role/**
              - .github/workflows/terraform.yml
            envs/prod/api:
              - infra/terraform/envs/prod/api/**
              - .github/workflows/terraform.yml
            envs/prod/app:
              - infra/terraform/envs/prod/app/**
              - .github/workflows/terraform.yml

  plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.roots != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.changes.outputs.roots) }}
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false -lockfile=readonly

      - id: plan
        run: terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt

      - name: Comment plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          ROOT: ${{ matrix.root }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const root = process.env.ROOT;
            const marker = `<!-- terraform-plan:${root} -->`;
            const file = `infra/terraform/${root}/plan.txt`;
            const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no output)';
            const output = raw.length > 60000 ? `...truncated...\n${raw.slice(-60000)}` : raw;
            const body = [
              marker,
              `### Terraform plan: \`${root}\` (${process.env.OUTCOME})`,
              '```',
              output,
              '```',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.roots != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        root: ${{ fromJSON(needs.changes.outputs.roots) }}
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false -lockfile=readonly
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
