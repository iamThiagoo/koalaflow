name: koalaflow

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: koalaflow
      POSTGRES_PASSWORD: koalaflow
      POSTGRES_DB: koalaflow
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U koalaflow -d koalaflow]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  floci:
    image: floci/floci:2.3.0
    ports:
      - 127.0.0.1:${FLOCI_PORT:-4566}:4566

volumes:
  postgres-data:
  redis-data:
