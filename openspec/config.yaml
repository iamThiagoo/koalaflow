schema: spec-driven

context: |
  Language: English
  All artifacts, code, identifiers and commit messages must be written in English,
  even when the conversation with the user is in another language.

  Commits: one line, Conventional Commits "<type>(<scope>): <subject>" (e.g. feat(infra): ..., feat(site): ...),
  lowercase imperative subject, no body, no Co-Authored-By; one commit per area (infra, site, app, api, worker, ui).

  Product: Koalaflow, a video hosting platform (Vimeo / Panda Video style):
  upload -> FFmpeg transcoding to HLS -> signed CloudFront delivery -> embedded player.

  Monorepo: Nx + pnpm, Node 24. Apps:
  - apps/api: NestJS 12 (ESM), @nestjs/cqrs, built with tsc
  - apps/app: Next (creator dashboard; the player is the /embed/[videoId] route, Video.js 10)
  - apps/site: Next static export (public marketing site, pt-BR only)
  - apps/worker: Node + FFmpeg, consumes SQS

  Architecture (DDD):
  - Bounded contexts live in packages/<context>/{domain,application,infrastructure}
  - packages/ui is the shared frontend design-token package, not a bounded context
  - domain has no framework or infrastructure dependencies
  - Events inside a context: @nestjs/cqrs EventBus; between contexts/services: outbox table -> SQS
  - Postgres is the main database
  - AWS via Terraform, Docker; LocalStack for local S3/SQS
  - infra/terraform (Nx project @koalaflow/infra): roots bootstrap/, global/, envs/<env>/<component>/ (one state each), shared modules/
  - Single AWS account, us-east-1, prod only for now; S3 remote state with native locking
  - CI authenticates to AWS with GitHub OIDC roles only (no static keys); Terraform plans on PRs, applies on main behind the production environment

  Security (full policy: the "Security" section of CLAUDE.md; OWASP Top 10, OWASP API Security Top 10, ASVS Level 2):
  - A change is security-sensitive when it touches authentication, sessions or tokens; authorization or tenant-scoped data;
    uploads, S3 keys, file paths or FFmpeg; playback signing, keys or embed domain rules; requests to URLs from input;
    raw SQL; IAM, networking or anything public; secrets; payments or webhooks; personal data; a new dependency or GitHub Action
  - Main risks for this product: cross-tenant access (BOLA), leaked or long-lived playback URLs,
    hostile media files (FFmpeg reading local files or making requests), embeds on unauthorized domains
  - Effort is proportional: changes that are not security-sensitive need no threat analysis

  Secrets and personal data:
  - Never in the repository (gitleaks runs in pre-push and CI), never in Terraform variables or state, never in build-time env of the Next apps
  - Apps read secrets at runtime from Secrets Manager or SSM; private keys (e.g. CloudFront signed URLs) are created outside Terraform
  - Sensitive CI inputs are GitHub secrets, not repository variables (variables are printed in logs)
  - The Terraform plan role may read the state but is denied application data (objects, secrets, parameters, KMS decrypt, items, logs)

  Product decisions:
  - B2B protected content (Panda style): videos private by default, domain-restricted embeds,
    signed URLs, no public discovery pages
  - Unit tests: Vitest + SWC

  Constraints:
  - Relative imports use the .js extension (ESM); Next apps use the @/ alias instead
  - Biome for format and lint (no ESLint/Prettier)
  - No webpack anywhere
  - No Nx Cloud
  - Run tasks through Nx: pnpm nx <target> <project>

  Code comments:
  - Comments about business rules or design decisions must be simple, short and objective,
    in a block comment with one "* Rule: ..." line per rule. Example:
      /**
       * Rule: a video can only be published after transcoding succeeds.
       */

  Testing policy:
  - Unit tests: write efficient unit tests that prioritize business rules, validations, calculations, error scenarios and relevant behaviors. Tests must verify expected results and behavior, not internal implementation details.
  - End-to-end (E2E) tests: write E2E tests when the integration between important modules, services or components needs to be validated. Not every flow needs an end-to-end test. Prioritize business-critical scenarios and those where integration can introduce significant failures.
  - Quality criterion: prefer tests that add confidence and help prevent regressions over chasing code coverage at any cost.
  - Maintainability: keep tests simple, deterministic, independent and easy to understand. Avoid duplication, unnecessary mocks and brittle tests that depend on internal details.
  - New features and fixes: every new feature or bug fix must add or update the relevant tests, following the criteria above.
  - Execution: run the relevant tests after making changes and fix any failures before considering the implementation complete.
  Goal: keep a reliable test suite proportional to the project's complexity, focused on business rules and the highest-risk areas.

rules:
  proposal:
    - State which bounded contexts are affected
    - Always state what is out of scope
    - "In Impact, add one line 'Security: <security-sensitive areas touched>' or 'Security: none' with a short reason"
  specs:
    - Every requirement has at least one error or edge-case scenario besides the happy path
    - Write scenarios as observable behavior (inputs and outcomes), never implementation details
    - For security-sensitive requirements, add scenarios for denied access (unauthenticated, another tenant, expired or tampered token) and for malicious or out-of-range input
  design:
    - "A security-sensitive change always has a design.md. In Risks / Trade-offs, list each threat as: [Risk] (OWASP category) → Mitigation → how it is verified (test or check)"
    - A risk left without mitigation is marked as accepted, with the reason, for the user to approve when reviewing
    - Name the aggregates and domain events involved
    - Call out new dependencies and why they are needed
    - "Include a test strategy following the testing policy: which business rules get unit tests and which critical integrations, if any, need E2E tests"
  tasks:
    - Pair each feature or bug-fix task with the tests it needs, following the testing policy
    - For security-sensitive changes, map every mitigation in design.md to a task with its test, and add a task before verification to review the diff against the security policy (/security-review) and fix the findings
    - End with a verification task running pnpm check and pnpm nx affected -t typecheck build test

operations:
  apply:
    guidance:
      - Follow the testing policy in the project context
      - Run the relevant tests after each change and fix any failures before marking a task or the change as done
      - Follow the Security section of CLAUDE.md; do not implement a security-sensitive change until design.md documents its risks and mitigations
      - If a new security risk appears while implementing, add it to design.md and tasks.md before continuing, instead of working around it silently
  archive:
    guidance:
      - Before archiving, confirm all tasks are checked and the verification task passed
      - For security-sensitive changes, confirm every mitigation in design.md has a checked task
      - Summarize which main specs were added or changed
